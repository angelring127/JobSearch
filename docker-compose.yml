services:
  db:
    image: postgis/postgis:16-3.4
    container_name: jobmap-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobmap
      POSTGRES_USER: jobmap
      POSTGRES_PASSWORD: jobmap
    ports:
      - "5432:5432"
    volumes:
      - jobmap-postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmap -d jobmap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobmap-postgres-data:
